<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PVM Kids \u2014 Financial Freedom Interactive Journey</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap');
  :root{
    --navy:#122452; --navy-d:#0b1836; --gold:#C9A227; --gold-l:#E4C767;
    --red:#C0272D; --blue:#1B5FAE; --green:#1F7A4D; --purple:#5B3A9E; --teal:#0F7A78;
    --ink:#1A2233; --muted:#5B6478; --bg:#F4F6FA; --line:#DCE2EE;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter', Arial, sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column;
  }
  .display{ font-family:'Archivo Black', Arial, sans-serif; }

  /* ===== TOP BAR ===== */
  .topbar{
    background:linear-gradient(135deg, var(--navy-d), var(--navy));
    color:#fff; padding:12px 20px; display:flex; align-items:center; gap:14px;
    border-bottom:4px solid var(--gold); flex-shrink:0;
  }
  .topbar .logo{
    width:38px; height:42px; background:var(--gold); flex-shrink:0;
    clip-path: polygon(50% 0%, 100% 22%, 100% 68%, 50% 100%, 0% 68%, 0% 22%);
    display:flex; align-items:center; justify-content:center; color:var(--navy-d); font-size:9px; font-weight:900;
  }
  .topbar .brand{ font-size:18px; font-weight:900; letter-spacing:0.5px; }
  .topbar .brand span{ color:var(--gold); }
  .topbar .spacer{ flex:1; }
  .topbar .backbtn{
    background:rgba(255,255,255,0.14); border:none; color:#fff; padding:8px 14px; border-radius:20px;
    font-weight:700; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;
  }
  .topbar .backbtn:hover{ background:rgba(255,255,255,0.24); }
  .topbar .progresspill{
    background:rgba(255,255,255,0.14); border-radius:20px; padding:7px 14px; font-size:12.5px; font-weight:800;
    color:var(--gold-l); letter-spacing:0.5px;
  }

  /* ===== APP CONTAINER ===== */
  #app{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .screen{ flex:1; overflow-y:auto; padding:28px 20px 40px 20px; }
  .wrap{ max-width:920px; margin:0 auto; }

  /* ===== HOME SCREEN ===== */
  .hero{ text-align:center; margin-bottom:30px; }
  .hero .kicker{ color:var(--gold); font-weight:800; letter-spacing:3px; font-size:13px; margin-bottom:8px;}
  .hero h1{ font-size:34px; color:var(--navy-d); line-height:1.15; }
  .hero p{ color:var(--muted); font-size:15px; margin-top:10px; max-width:520px; margin-left:auto; margin-right:auto; }

  .levelgrid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:20px; }
  @media (max-width:680px){ .levelgrid{ grid-template-columns:1fr; } }
  .levelcard{
    background:#fff; border-radius:16px; padding:26px; border:1px solid var(--line); cursor:pointer;
    box-shadow:0 2px 10px rgba(18,36,82,0.06); transition:transform .15s ease, box-shadow .15s ease;
    display:flex; flex-direction:column; gap:14px; position:relative; overflow:hidden;
  }
  .levelcard:hover{ transform:translateY(-4px); box-shadow:0 10px 24px rgba(18,36,82,0.14); }
  .levelcard .badge{ align-self:flex-start; font-size:11.5px; font-weight:900; letter-spacing:1.5px; padding:5px 12px; border-radius:20px; color:#fff; }
  .levelcard h2{ font-size:23px; color:var(--navy-d); }
  .levelcard p{ color:var(--muted); font-size:13.5px; line-height:1.5; }
  .levelcard .stages{ display:flex; gap:8px; flex-wrap:wrap; margin-top:2px; }
  .stagechip{ font-size:10.5px; font-weight:800; letter-spacing:0.5px; padding:4px 9px; border-radius:12px; color:#fff; }
  .progressbar{ height:9px; background:var(--bg); border-radius:6px; overflow:hidden; margin-top:6px; border:1px solid var(--line); }
  .progressbar > div{ height:100%; border-radius:6px; transition:width .4s ease; }
  .progresslabel{ font-size:12px; color:var(--muted); font-weight:700; margin-top:4px; }
  .enterrow{ display:flex; align-items:center; justify-content:space-between; margin-top:4px; }
  .enterbtn{ font-weight:800; font-size:13.5px; color:#fff; padding:9px 16px; border-radius:20px; border:none; cursor:pointer; }

  /* ===== MAP SCREEN ===== */
  .mapheader{ text-align:center; margin-bottom:22px; }
  .mapheader h2{ font-size:26px; color:var(--navy-d); }
  .mapheader p{ color:var(--muted); font-size:14px; margin-top:6px; }
  .nodegrid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; }
  @media (max-width:680px){ .nodegrid{ grid-template-columns:repeat(2, 1fr); } }
  .node{
    background:#fff; border:2px solid var(--line); border-radius:14px; padding:16px 10px; text-align:center;
    cursor:pointer; transition:transform .12s ease, border-color .12s ease; position:relative;
  }
  .node:hover{ transform:translateY(-3px); }
  .node .wnum{ font-size:11px; font-weight:800; color:var(--muted); letter-spacing:1px; }
  .node .wicon{ width:44px; height:44px; border-radius:50%; margin:8px auto; display:flex; align-items:center; justify-content:center; color:#fff; font-size:19px; }
  .node .wtitle{ font-size:12px; font-weight:700; color:var(--ink); line-height:1.3; min-height:32px; }
  .node .check{ position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%; background:var(--green); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; font-weight:900; }

  /* ===== WEEK SCREEN ===== */
  .weekhead{ background:#fff; border-radius:14px; padding:20px 22px; border:1px solid var(--line); margin-bottom:18px; }
  .stagepillrow{ display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .pill{ font-size:11px; font-weight:900; letter-spacing:1.2px; padding:5px 12px; border-radius:20px; color:#fff; }
  .weekhead h2{ font-size:24px; color:var(--red); line-height:1.2; }
  .weekhead h2 .l2{ color:var(--navy-d); display:block; }
  .weekhead .sub{ color:var(--muted); font-size:14px; margin-top:8px; }
  .factchip{ background:var(--bg); border-left:4px solid var(--navy-d); padding:9px 12px; font-size:12px; font-weight:700; color:var(--ink); border-radius:0 6px 6px 0; margin-top:12px; }

  .progressdots{ display:flex; gap:6px; justify-content:center; margin:14px 0 18px 0; flex-wrap:wrap; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--line); cursor:pointer; }
  .dot.active{ background:var(--navy); width:22px; border-radius:5px; }
  .dot.done{ background:var(--gold); }

  .sectioncard{ background:#fff; border-radius:14px; border:1px solid var(--line); overflow:hidden; margin-bottom:20px; }
  .sectionhead{ padding:13px 20px; font-weight:900; font-size:14.5px; letter-spacing:1px; color:#fff; display:flex; align-items:center; gap:8px; }
  .sectionbody{ padding:22px; }

  ul.bullets{ list-style:none; }
  ul.bullets li{ position:relative; padding-left:18px; margin-bottom:11px; font-size:14.5px; line-height:1.5; }
  ul.bullets li::before{ content:"\2022"; position:absolute; left:0; color:var(--red); font-weight:900; }

  .datarow{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px dashed var(--line); gap:10px; }
  .datarow:last-child{ border-bottom:none; }
  .datarow .lbl{ font-weight:800; font-size:13px; color:var(--navy-d); width:32%; }
  .datarow .val{ text-align:right; width:34%; }
  .datarow .val b{ font-size:19px; color:var(--red); display:block; }
  .datarow .val span{ font-size:11px; color:var(--muted); }
  .datarow .note{ font-size:12px; color:var(--muted); width:34%; text-align:right; }

  .nmgrid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:600px){ .nmgrid{ grid-template-columns:1fr; } }
  .nmbox{ background:var(--bg); border-top:4px solid; border-radius:6px; padding:14px 10px; text-align:center; }
  .nmbox .l{ font-size:10.5px; font-weight:800; color:var(--muted); letter-spacing:0.5px; }
  .nmbox .v{ font-size:22px; font-weight:900; margin:5px 0; }
  .nmbox .n{ font-size:11.5px; color:var(--muted); }

  .fact{ background:var(--bg); border-left:4px solid var(--navy-d); padding:16px 18px; border-radius:0 8px 8px 0; font-size:14.5px; line-height:1.55; }

  .checklist{ list-style:none; }
  .checkitem{ display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:10px; cursor:pointer; margin-bottom:6px; transition:background .12s; }
  .checkitem:hover{ background:var(--bg); }
  .checkbox{ width:24px; height:24px; border-radius:6px; border:2px solid var(--gold); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-weight:900; color:#fff; font-size:14px; }
  .checkitem.checked .checkbox{ background:var(--gold); }
  .checkitem span.txt{ font-size:14.5px; }
  .checkitem.checked span.txt{ color:var(--muted); text-decoration:line-through; }
  .checkprogress{ margin-top:14px; font-size:13px; font-weight:700; color:var(--muted); }

  .reallife{ font-size:14.5px; line-height:1.6; }

  .cyclewrap{ display:flex; flex-direction:column; align-items:center; }

  .strategistlist{ list-style:none; }
  .strategistlist li{ background:var(--bg); border-radius:10px; padding:14px 16px; margin-bottom:10px; font-weight:600; font-size:14px; color:var(--navy-d); }

  .quizq{ font-size:15px; font-weight:700; margin-bottom:16px; line-height:1.5; }
  .choices{ display:flex; flex-direction:column; gap:10px; }
  .choicebtn{
    text-align:left; padding:14px 16px; border-radius:10px; border:2px solid var(--line); background:#fff;
    cursor:pointer; font-size:14px; font-weight:600; color:var(--ink); display:flex; align-items:center; gap:12px;
    transition:border-color .12s, background .12s;
  }
  .choicebtn:hover{ border-color:var(--blue); }
  .choicebtn .lettercirc{ width:26px; height:26px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:12px; flex-shrink:0; color:var(--navy-d); }
  .choicebtn.correct{ border-color:var(--green); background:#EAF6EF; }
  .choicebtn.correct .lettercirc{ background:var(--green); color:#fff; }
  .choicebtn.incorrect{ border-color:var(--red); background:#FBEAEB; }
  .choicebtn.incorrect .lettercirc{ background:var(--red); color:#fff; }
  .choicebtn.disabled{ cursor:default; }
  .feedback{ margin-top:16px; padding:14px 16px; border-radius:10px; font-size:14px; font-weight:700; line-height:1.5; }
  .feedback.good{ background:#EAF6EF; color:var(--green); }
  .feedback.bad{ background:#FBEAEB; color:var(--red); }
  textarea.explain{ width:100%; margin-top:14px; border:2px solid var(--line); border-radius:10px; padding:12px 14px; font-family:inherit; font-size:13.5px; resize:vertical; min-height:70px; }
  textarea.explain:focus{ outline:none; border-color:var(--blue); }

  .takeawaybox{ text-align:center; padding:10px 0; }
  .trophybig{ width:70px; height:70px; border-radius:50%; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto 16px auto; }
  .takeawaybox .msg{ font-size:20px; font-weight:900; color:var(--navy-d); line-height:1.35; max-width:540px; margin:0 auto; }
  .completebtn{ margin-top:22px; background:var(--green); color:#fff; border:none; padding:14px 30px; border-radius:24px; font-weight:800; font-size:15px; cursor:pointer; }
  .completebtn:hover{ opacity:0.9; }

  .navrow{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; gap:12px; }
  .navbtn{ background:var(--navy); color:#fff; border:none; padding:12px 22px; border-radius:24px; font-weight:800; font-size:14px; cursor:pointer; }
  .navbtn.secondary{ background:#fff; color:var(--navy); border:2px solid var(--line); }
  .navbtn:disabled{ opacity:0.35; cursor:not-allowed; }

  /* ===== MONEY RUN GAME ===== */
  .gamewrap{ user-select:none; }
  .gameintro{ font-size:13.5px; color:var(--muted); margin-bottom:16px; line-height:1.5; }
  .track{
    position:relative; height:120px; background:linear-gradient(180deg,#EAF1FB,#F4F6FA);
    border-radius:12px; margin-bottom:22px; overflow:hidden; border:1px solid var(--line);
  }
  .trackline{ position:absolute; left:20px; right:20px; bottom:28px; height:4px; background:var(--line); border-radius:2px; }
  .trackflag{ position:absolute; right:14px; bottom:20px; font-size:26px; }
  .obstacle{
    position:absolute; bottom:30px; font-size:22px; transform:translateX(-50%);
    transition:opacity .3s ease, transform .3s ease;
  }
  .obstacle.passed{ opacity:0.25; transform:translateX(-50%) scale(0.8); }
  .runner{
    position:absolute; bottom:24px; left:20px; font-size:34px; transition:left .55s cubic-bezier(.34,1.4,.64,1);
    transform:translateX(-50%);
  }
  .runner.jump{ animation:jumpArc .55s ease; }
  @keyframes jumpArc{
    0%{ transform:translateX(-50%) translateY(0); }
    40%{ transform:translateX(-50%) translateY(-38px) rotate(-8deg); }
    100%{ transform:translateX(-50%) translateY(0); }
  }
  .runner.stumble{ animation:stumbleShake .4s ease; }
  @keyframes stumbleShake{
    0%,100%{ transform:translateX(-50%) rotate(0); }
    25%{ transform:translateX(-50%) rotate(-14deg); }
    75%{ transform:translateX(-50%) rotate(10deg); }
  }
  .zones{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:20px; }
  @media (max-width:600px){ .zones{ grid-template-columns:1fr; } }
  .dropzone{
    border:3px dashed var(--line); border-radius:12px; padding:16px 14px; text-align:center; min-height:78px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    transition:border-color .15s, background .15s;
  }
  .dropzone .zlabel{ font-weight:900; font-size:13.5px; letter-spacing:0.5px; }
  .dropzone .zsub{ font-size:11px; color:var(--muted); }
  .dropzone.zone-smart{ border-color:#9FD3B4; }
  .dropzone.zone-smart .zlabel{ color:var(--green); }
  .dropzone.zone-risky{ border-color:#E8A9AC; }
  .dropzone.zone-risky .zlabel{ color:var(--red); }
  .dropzone.hover-smart{ background:#EAF6EF; border-color:var(--green); }
  .dropzone.hover-risky{ background:#FBEAEB; border-color:var(--red); }
  .tilepool{ display:flex; flex-wrap:wrap; gap:10px; min-height:52px; }
  .tile{
    background:#fff; border:2px solid var(--line); border-radius:10px; padding:12px 14px; font-size:13.5px;
    font-weight:600; cursor:grab; touch-action:none; box-shadow:0 2px 4px rgba(18,36,82,0.05);
    transition:box-shadow .12s, border-color .12s;
  }
  .tile:hover{ border-color:var(--blue); }
  .tile.dragging{ position:fixed; z-index:500; box-shadow:0 8px 20px rgba(18,36,82,0.25); cursor:grabbing; pointer-events:none; }
  .gamestatus{ text-align:center; font-size:13px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  .gamedone{ text-align:center; padding:20px 0; }
  .gamedone .big{ font-size:19px; font-weight:900; color:var(--navy-d); margin:10px 0 16px 0; }
  .playagainbtn{ background:var(--blue); color:#fff; border:none; padding:11px 22px; border-radius:22px; font-weight:800; font-size:13.5px; cursor:pointer; }

  /* confetti */
  .confetti-piece{
    position:fixed; top:-10px; width:9px; height:14px; z-index:999; opacity:0.9; border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(110vh) rotate(540deg); opacity:0.4; }
  }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:6px; }
</style>
</head>

function openLevel(lvl){ state.level=lvl; state.screen='map'; render(); }

function currentWeek(){ return WEEKS_DATA[state.level][state.weekIndex]; }
function keyFor(w){ return `${state.level}-${w.week}`; }

function renderHome(){
  const app = document.getElementById('app');
  const introDone = state.completed.intro.size, advDone = state.completed.advanced.size;
  app.innerHTML = `
  <div class="screen"><div class="wrap">
    <div class="hero">
      <div class="kicker">\u2605 INTERACTIVE JOURNEY \u2605</div>
      <h1 class="display">Your Financial Freedom Adventure</h1>
      <p>24 weeks. Two levels. Real skills for real life. Pick a level below to jump in \u2014 tap through each week, take the quiz, and build your streak!</p>
    </div>
    <div class="levelgrid">
      ${renderLevelCard('intro', introDone)}
      ${renderLevelCard('advanced', advDone)}
    </div>
  </div></div>`;
}
function renderLevelCard(lvl, done){
  const meta = LEVEL_META[lvl];
  const pct = Math.round(done/12*100);
  return `
    <div class="levelcard" onclick="openLevel('${lvl}')">
      <div class="badge" style="background:${meta.color}">${meta.tag.toUpperCase()}</div>
      <h2 class="display">${meta.title}</h2>
      <p>${meta.desc}</p>
      <div class="stages">
        ${['EARN','KEEP','GROW','REPEAT'].map(s=>`<span class="stagechip" style="background:${STAGE_COLOR[s]}">${STAGE_ICON[s]} ${s}</span>`).join('')}
      </div>
      <div class="progressbar"><div style="width:${pct}%; background:${meta.color}"></div></div>
      <div class="progresslabel">${done} / 12 weeks complete</div>
      <div class="enterrow">
        <span style="font-size:13px;color:var(--muted);font-weight:700;">${done===0?'Not started':(done===12?'All done! \u2605':'In progress')}</span>
        <button class="enterbtn" style="background:${meta.color}">Enter \u2192</button>
      </div>
    </div>`;
}

function renderMap(){
  const app = document.getElementById('app');
  const meta = LEVEL_META[state.level];
  const weeks = WEEKS_DATA[state.level];
  app.innerHTML = `
  <div class="screen"><div class="wrap">
    <div class="mapheader">
      <h2 class="display">${meta.title}</h2>
      <p>Tap any week to start \u2014 explore in any order you like!</p>
    </div>
    <div class="nodegrid">
      ${weeks.map((w,i)=>{
        const done = state.completed[state.level].has(w.week);
        return `
        <div class="node" onclick="openWeek(${i})">
          ${done?'<div class="check">\u2713</div>':''}
          <div class="wnum">WEEK ${w.week}</div>
          <div class="wicon" style="background:${STAGE_COLOR[w.stage]}">${STAGE_ICON[w.stage]}</div>
          <div class="wtitle">${w.headline}</div>
        </div>`;
      }).join('')}
    </div>
  </div></div>`;
}

function renderWeek(){
  const app = document.getElementById('app');
  const w = currentWeek();
  const sec = SECTION_ORDER[state.section];
  app.innerHTML = `
  <div class="screen"><div class="wrap">
    <div class="weekhead">
      <div class="stagepillrow">
        <span class="pill" style="background:${STAGE_COLOR[w.stage]}">STAGE: ${w.stage}</span>
        <span class="pill" style="background:var(--navy-d)">WEEK ${w.week} OF 12</span>
      </div>
      <h2 class="display">${w.headline}<span class="l2">${w.headline2}</span></h2>
      <div class="sub">${w.subhead}</div>
      <div class="factchip">\u{1F4A1} ${w.fact_callout}</div>
    </div>

    <div class="progressdots">
      ${SECTION_ORDER.map((s,i)=>`<div class="dot ${i===state.section?'active':''}" onclick="jumpSection(${i})"></div>`).join('')}
    </div>

    <div class="sectioncard">
      <div class="sectionhead" style="background:${SECTION_COLOR[sec]}">${SECTION_ICON[sec]}&nbsp; ${SECTION_LABEL[sec].toUpperCase()}</div>
      <div class="sectionbody">${renderSection(sec, w)}</div>
    </div>

    <div class="navrow">
      <button class="navbtn secondary" onclick="prevSection()" ${state.section===0?'disabled':''}>\u2190 Back</button>
      <button class="navbtn" onclick="nextSection()" ${state.section===SECTION_ORDER.length-1?'disabled':''}>Next \u2192</button>
    </div>
  </div></div>`;
  attachSectionHandlers(sec, w);
}

function renderSection(sec, w){
  if(sec==='big_picture'){
    return `<ul class="bullets">${w.big_picture.map(b=>`<li>${b}</li>`).join('')}</ul>`;
  }
  if(sec==='data'){
    return `<div style="font-weight:800;color:var(--navy-d);font-size:13px;letter-spacing:0.5px;margin-bottom:8px;">${w.data_title.toUpperCase()}</div>` +
      w.data_rows.map(r=>`
        <div class="datarow">
          <div class="lbl">${r[0]}</div>
          <div class="val"><b>${r[1]}</b><span>${r[2]}</span></div>
          <div class="note">${r[3]}</div>
        </div>`).join('');
  }
  if(sec==='numbers'){
    const colors=['var(--green)','var(--gold)','var(--red)'];
    return `<div class="nmgrid">${w.numbers_meaning.map((n,i)=>`
      <div class="nmbox" style="border-top-color:${colors[i%3]}">
        <div class="l">${n[0]}</div><div class="v" style="color:${colors[i%3]}">${n[1]}</div><div class="n">${n[2]}</div>
      </div>`).join('')}</div>`;
  }
  if(sec==='affects'){
    return `<div style="font-weight:800;color:var(--navy-d);font-size:14px;margin-bottom:10px;">${w.affects_title}</div><ul class="bullets">${w.affects.map(b=>`<li>${b}</li>`).join('')}</ul>`;
  }
  if(sec==='dyk'){
    return `<div class="fact">${w.did_you_know}</div>`;
  }
  if(sec==='smart'){
    const k = keyFor(w);
    if(!state.checklists[k]) state.checklists[k] = new Set();
    const checked = state.checklists[k];
    return `<ul class="checklist">${w.smart_people.map((s,i)=>`
      <li class="checkitem ${checked.has(i)?'checked':''}" data-idx="${i}">
        <div class="checkbox">${checked.has(i)?'\u2713':''}</div><span class="txt">${s}</span>
      </li>`).join('')}</ul>
      <div class="checkprogress">${checked.size} / ${w.smart_people.length} habits checked off \u2014 nice work!</div>`;
  }
  if(sec==='reallife'){
    return `<div style="font-weight:800;color:var(--navy-d);font-size:14px;margin-bottom:10px;">${w.real_life_title}</div><div class="reallife">${w.real_life}</div>`;
  }
  if(sec==='pattern'){
    return `<div class="cyclewrap">${cycleSvg(w.stage)}</div>`;
  }
  if(sec==='strategist'){
    return `<ul class="strategistlist">${w.strategist_qs.map(q=>`<li>${q}</li>`).join('')}</ul>`;
  }
  if(sec==='quiz'){
    const k = keyFor(w);
    const picked = state.quizPicked[k];
    const letters = ['A','B','C'];
    return `
      <div class="quizq">${w.ff_question}</div>
      <div class="choices">
        ${w.ff_choices.map((c,i)=>{
          let cls='';
          if(picked!==undefined){
            cls='disabled';
            if(i===w.correct_index) cls+=' correct';
            else if(i===picked) cls+=' incorrect';
          }
          return `<button class="choicebtn ${cls}" data-idx="${i}" ${picked!==undefined?'disabled':''}>
            <span class="lettercirc">${letters[i]}</span>${c}
          </button>`;
        }).join('')}
      </div>
      ${picked!==undefined ? `<div class="feedback ${picked===w.correct_index?'good':'bad'}">
        ${picked===w.correct_index ? '\u2705 Great strategy! ' + w.takeaway : '\u{1F914} Good thinking \u2014 the strongest strategy here is choice ' + letters[w.correct_index] + '. ' + w.takeaway}
      </div>` : ''}
      <textarea class="explain" placeholder="Explain your strategy in your own words (optional)..."></textarea>
    `;
  }
  if(sec==='game'){
    const k = keyFor(w);
    if(!state.games[k]) initGame(k, w);
    const g = state.games[k];
    const total = w.game_tiles.length;
    const trackPct = total>1 ? (g.solved/total)*80 : 0; // leave room so runner doesn't overlap flag
    return `
      <div class="gamewrap">
        <div class="gameintro">Drag each card into the zone where it belongs. Every correct drop sends your runner jumping over the next obstacle \u2014 sort them all to reach the finish line!</div>
        <div class="gamestatus">${g.solved} / ${total} sorted</div>
        <div class="track" id="track">
          ${w.game_tiles.map((t,i)=>{
            const pos = 12 + (i/(total)) * 76;
            return `<div class="obstacle ${i<g.solved?'passed':''}" style="left:${pos}%">\u{1F6A7}</div>`;
          }).join('')}
          <div class="trackline"></div>
          <div class="trackflag">\u{1F3C1}</div>
          <div class="runner" id="runner" style="left:${12+trackPct}%">\u{1F3C3}</div>
        </div>
        ${g.done ? `
          <div class="gamedone">
            <div style="font-size:40px;">\u{1F3C6}</div>
            <div class="big display">You crossed the finish line!</div>
            <button class="playagainbtn" onclick="resetGame('${k}')">\u21BB Play Again</button>
          </div>
        ` : `
          <div class="zones">
            <div class="dropzone zone-smart" data-zone="smart"><div class="zlabel">\u2705 SMART MOVE</div><div class="zsub">Builds financial freedom</div></div>
            <div class="dropzone zone-risky" data-zone="risky"><div class="zlabel">\u26A0\uFE0F RISKY MOVE</div><div class="zsub">Hurts financial freedom</div></div>
          </div>
          <div class="tilepool" id="tilepool">
            ${g.pool.map(t=>`<div class="tile" data-id="${t.id}" data-type="${t.type}">${t.text}</div>`).join('')}
          </div>
        `}
      </div>`;
  }
  if(sec==='takeaway'){
    const done = state.completed[state.level].has(w.week);
    return `
      <div class="takeawaybox">
        <div class="trophybig">\u{1F3C6}</div>
        <div class="msg display">${w.takeaway}</div>
        <button class="completebtn" onclick="completeWeek()">${done ? '\u2713 Week Complete!' : 'Mark Week Complete \u2192'}</button>
      </div>`;
  }
  return '';
}

function attachSectionHandlers(sec, w){
  if(sec==='smart'){
    document.querySelectorAll('.checkitem').forEach(item=>{
      item.addEventListener('click', ()=>{
        const idx = parseInt(item.getAttribute('data-idx'));
        const k = keyFor(w);
        const set = state.checklists[k];
        if(set.has(idx)) set.delete(idx); else set.add(idx);
        renderWeek();
      });
    });
  }
  if(sec==='quiz'){
    document.querySelectorAll('.choicebtn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = parseInt(btn.getAttribute('data-idx'));
        const k = keyFor(w);
        if(state.quizPicked[k]===undefined){
          state.quizPicked[k] = idx;
          renderWeek();
        }
      });
    });
  }
  if(sec==='game'){
    attachGameHandlers(w);
  }
}

function initGame(k, w){
  const tiles = w.game_tiles.map((t,i)=>({ id:k+'-'+i, text:t.text, type:t.type }));
  for(let i=tiles.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [tiles[i],tiles[j]] = [tiles[j],tiles[i]];
  }
  state.games[k] = { pool: tiles, solved: 0, done: false };
}
function resetGame(k){
  delete state.games[k];
  renderWeek();
}

function attachGameHandlers(w){
  const pool = document.getElementById('tilepool');
  if(!pool) return;
  pool.querySelectorAll('.tile').forEach(tile=>{
    tile.addEventListener('pointerdown', (e)=>startDrag(e, tile, w));
  });
}

let dragCtx = null;
function startDrag(e, tile, w){
  e.preventDefault();
  const rect = tile.getBoundingClientRect();
  const offsetX = e.clientX - rect.left;
  const offsetY = e.clientY - rect.top;
  const placeholder = document.createElement('div');
  placeholder.className = 'tile';
  placeholder.style.visibility = 'hidden';
  placeholder.style.width = rect.width+'px';
  placeholder.style.height = rect.height+'px';
  tile.parentNode.insertBefore(placeholder, tile);

  tile.classList.add('dragging');
  tile.style.width = rect.width+'px';
  tile.style.left = rect.left+'px';
  tile.style.top = rect.top+'px';
  document.body.appendChild(tile);

  dragCtx = { tile, placeholder, offsetX, offsetY, w };

  function onMove(ev){
    if(!dragCtx) return;
    tile.style.left = (ev.clientX - offsetX)+'px';
    tile.style.top = (ev.clientY - offsetY)+'px';
    document.querySelectorAll('.dropzone').forEach(z=>{
      z.classList.remove('hover-smart','hover-risky');
    });
    const zone = zoneUnder(ev.clientX, ev.clientY);
    if(zone) zone.classList.add(zone.dataset.zone==='smart' ? 'hover-smart' : 'hover-risky');
  }
  function onUp(ev){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    finishDrag(ev.clientX, ev.clientY);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function zoneUnder(x,y){
  const zones = document.querySelectorAll('.dropzone');
  for(const z of zones){
    const r = z.getBoundingClientRect();
    if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return z;
  }
  return null;
}

function finishDrag(x,y){
  if(!dragCtx) return;
  const { tile, placeholder, w } = dragCtx;
  document.querySelectorAll('.dropzone').forEach(z=> z.classList.remove('hover-smart','hover-risky'));
  const zone = zoneUnder(x,y);
  const k = keyFor(w);
  const g = state.games[k];
  const tileType = tile.dataset.type;

  if(zone && zone.dataset.zone === tileType){
    g.pool = g.pool.filter(t => t.id !== tile.dataset.id);
    g.solved += 1;
    if(g.solved >= w.game_tiles.length) g.done = true;
    tile.remove(); placeholder.remove();
    renderWeek();
    const runner = document.getElementById('runner');
    if(runner){ runner.classList.add('jump'); setTimeout(()=>runner.classList.remove('jump'), 600); }
    if(g.done) setTimeout(launchConfetti, 300);
  } else if(zone){
    tile.remove();
    placeholder.replaceWith(tile);
    tile.classList.remove('dragging');
    tile.style.left=''; tile.style.top=''; tile.style.width='';
    const runner = document.getElementById('runner');
    if(runner){ runner.classList.add('stumble'); setTimeout(()=>runner.classList.remove('stumble'), 450); }
  } else {
    tile.remove();
    placeholder.replaceWith(tile);
    tile.classList.remove('dragging');
    tile.style.left=''; tile.style.top=''; tile.style.width='';
  }
  dragCtx = null;
}

function jumpSection(i){ state.section=i; renderWeek(); }
function nextSection(){ if(state.section<SECTION_ORDER.length-1){ state.section++; renderWeek(); window.scrollTo(0,0);} }
function prevSection(){ if(state.section>0){ state.section--; renderWeek(); window.scrollTo(0,0);} }

function completeWeek(){
  const w = currentWeek();
  const wasComplete = state.completed[state.level].has(w.week);
  state.completed[state.level].add(w.week);
  if(!wasComplete) launchConfetti();
  renderWeek();
  renderTopbar();
}

function cycleSvg(activeStage){
  const stages=['EARN','KEEP','GROW','REPEAT'];
  const cx=[65,205,345,485];
  const colorMap={EARN:'#1F7A4D',KEEP:'#C9A227',GROW:'#1B5FAE',REPEAT:'#5B3A9E'};
  let parts = [`<svg viewBox="0 0 550 175" style="width:100%;max-width:520px;height:auto">`];
  stages.forEach((s,i)=>{
    const x=cx[i]; const active = s===activeStage; const color=colorMap[s]; const r = active?42:36;
    parts.push(`<circle cx="${x}" cy="55" r="${r}" fill="${color}" opacity="${active?1:0.32}"/>`);
    if(active) parts.push(`<circle cx="${x}" cy="55" r="${r+6}" fill="none" stroke="${color}" stroke-width="3"/>`);
    parts.push(`<text x="${x}" y="63" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="white">${STAGE_ICON[s]}</text>`);
    parts.push(`<text x="${x}" y="122" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="${active?color:'#122452'}">${s}</text>`);
    if(i<stages.length-1){
      parts.push(`<line x1="${x+44}" y1="55" x2="${cx[i+1]-44}" y2="55" stroke="#5B6478" stroke-width="2.5" marker-end="url(#arrH)"/>`);
    }
  });
  parts.push(`<path d="M ${cx[3]} 100 Q ${(cx[3]+cx[0])/2} 150 ${cx[0]} 100" fill="none" stroke="#5B6478" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrH)"/>`);
  parts.push(`<defs><marker id="arrH" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5B6478"/></marker></defs>`);
  parts.push('</svg>');
  return parts.join('');
}

function launchConfetti(){
  const colors=['#C9A227','#1B5FAE','#1F7A4D','#5B3A9E','#C0272D'];
  for(let i=0;i<60;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.animationDuration = (2+Math.random()*1.5)+'s';
    p.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 4000);
  }
}

function render(){
  renderTopbar();
  if(state.screen==='home') renderHome();
  else if(state.screen==='map') renderMap();
  else if(state.screen==='week') renderWeek();
}

render();
</script>
</body>
</html>
